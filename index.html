<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf4e6" />
    <title>NoobCode</title>
    <script>
      // Apply the color theme before first paint to avoid a flash.
      // Preference: noobcode-color-scheme = system | light | dark (default system
      // on first visit). Legacy installs with only noobcode-theme keep that lock.
      try {
        var DARK = { charcoal: 1, midnight: 1, grape: 1 }
        var scheme = localStorage.getItem('noobcode-color-scheme')
        var t = localStorage.getItem('noobcode-theme')
        if (scheme !== 'system' && scheme !== 'light' && scheme !== 'dark') scheme = 'system'
        var dark =
          scheme === 'dark' ||
          (scheme === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (scheme === 'system' || !t || t === 'custom' || !!DARK[t] !== dark) {
          t =
            localStorage.getItem(dark ? 'noobcode-last-dark-theme' : 'noobcode-last-light-theme') ||
            (dark ? 'midnight' : 'cream')
        }
        if (t) document.documentElement.dataset.theme = t
        if (t === 'custom' && scheme !== 'system') {
          var c = JSON.parse(localStorage.getItem('noobcode-custom-theme') || '{}')
          var root = document.documentElement
          for (var k in c) root.style.setProperty('--color-' + k, c[k])
          if (c.accent) {
            var h = c.accent.replace('#', '')
            var r = parseInt(h.slice(0, 2), 16)
            var g = parseInt(h.slice(2, 4), 16)
            var b = parseInt(h.slice(4, 6), 16)
            root.style.setProperty('--color-accent-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.12)')
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
